<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky-top: #1a3a5c;
    --sky-mid: #2e6b9e;
    --sky-horizon: #7db8d8;
    --sky-glow: #f0c87a;
    --cloud-white: rgba(255,252,245,0.92);
    --kiki-red: #c8302b;
    --kiki-cream: #fff8f0;
    --google-blue: #4285f4;
    --google-blue-dark: #1a56c4;
    --card-bg: rgba(255, 252, 248, 0.14);
    --card-border: rgba(255,255,255,0.22);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
  }

  /* ── Sky canvas ── */
  #sky {
    position: fixed; inset: 0;
    background: linear-gradient(
      180deg,
      #0d2240 0%,
      #1a3f6b 18%,
      #2e6b9e 42%,
      #5c9ec4 64%,
      #a0cce0 80%,
      #ddeef7 92%,
      #f2e8d5 100%
    );
  }

  /* ── Stars ── */
  .star {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    animation: twinkle var(--d, 3s) var(--delay, 0s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: var(--op, 0.9); transform: scale(1.2); }
  }

  /* ── Moon ── */
  #moon {
    position: absolute;
    top: 6vh; right: 14vw;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 40%, #fff8e7, #f5d97a 60%, #d4a520);
    box-shadow: 0 0 40px 10px rgba(245, 217, 122, 0.35), 0 0 90px 30px rgba(245, 217, 122, 0.15);
    animation: moonFloat 8s ease-in-out infinite alternate;
  }
  @keyframes moonFloat {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-8px); }
  }

  /* ── Clouds ── */
  .cloud {
    position: absolute;
    border-radius: 60px;
    background: var(--cloud-white);
    opacity: 0.88;
    animation: drift var(--dur, 60s) linear infinite;
    filter: blur(0.4px);
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(110vw)); }
  }

  /* Big puffy cloud */
  .cloud-a {
    width: 220px; height: 60px;
    top: 28vh; left: -240px;
    --dur: 90s;
    opacity: 0.72;
  }
  .cloud-a::before {
    width: 100px; height: 80px;
    top: -40px; left: 35px;
  }
  .cloud-a::after {
    width: 70px; height: 60px;
    top: -30px; left: 110px;
  }

  .cloud-b {
    width: 160px; height: 44px;
    top: 18vh; left: -200px;
    --dur: 70s;
    animation-delay: -22s;
    opacity: 0.65;
  }
  .cloud-b::before {
    width: 80px; height: 65px;
    top: -34px; left: 24px;
  }
  .cloud-b::after {
    width: 55px; height: 50px;
    top: -26px; left: 88px;
  }

  .cloud-c {
    width: 300px; height: 70px;
    top: 38vh; left: -340px;
    --dur: 110s;
    animation-delay: -40s;
    opacity: 0.58;
  }
  .cloud-c::before {
    width: 130px; height: 100px;
    top: -52px; left: 50px;
  }
  .cloud-c::after {
    width: 95px; height: 75px;
    top: -38px; left: 160px;
  }

  .cloud-d {
    width: 120px; height: 34px;
    top: 55vh; left: -150px;
    --dur: 80s;
    animation-delay: -55s;
    opacity: 0.5;
  }
  .cloud-d::before {
    width: 58px; height: 48px;
    top: -26px; left: 18px;
  }
  .cloud-d::after {
    width: 44px; height: 38px;
    top: -20px; left: 64px;
  }

  .cloud-e {
    width: 190px; height: 52px;
    top: 12vh; left: -220px;
    --dur: 95s;
    animation-delay: -68s;
    opacity: 0.6;
  }
  .cloud-e::before {
    width: 90px; height: 72px;
    top: -38px; left: 30px;
  }
  .cloud-e::after {
    width: 65px; height: 55px;
    top: -28px; left: 100px;
  }

  /* ── Cityscape silhouette ── */
  #city {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38vh;
    pointer-events: none;
  }

  /* ── Kiki SVG character ── */
  #kiki-wrap {
    position: fixed;
    width: 140px;
    pointer-events: none;
    animation: kikiFly 14s linear infinite;
  }
  @keyframes kikiFly {
    0%   { left: -160px;             top: calc(42vh - 110px);  transform: scaleX(1); }
    10%  { left: calc(10vw - 70px);  top: calc(28vh - 110px);  transform: scaleX(1); }
    20%  { left: calc(22vw - 70px);  top: calc(10vh - 110px);  transform: scaleX(1); }
    30%  { left: calc(35vw - 70px);  top: -38px;               transform: scaleX(1); }
    40%  { left: calc(48vw - 70px);  top: -38px;               transform: scaleX(1); }
    50%  { left: calc(60vw - 70px);  top: calc(22vh - 110px);  transform: scaleX(1); }
    60%  { left: calc(72vw - 70px);  top: calc(50vh - 110px);  transform: scaleX(1); }
    70%  { left: calc(84vw - 70px);  top: calc(72vh - 110px);  transform: scaleX(1); }
    80%  { left: calc(93vw - 70px);  top: calc(82vh - 110px);  transform: scaleX(1); }
    90%  { left: calc(100vw - 70px); top: calc(75vh - 110px);  transform: scaleX(1); }
    100% { left: calc(110vw);        top: calc(42vh - 110px);  transform: scaleX(1); }
  }

  /* ── Bokeh particles ── */
  .bokeh {
    position: fixed;
    border-radius: 50%;
    background: rgba(255, 220, 100, 0.18);
    border: 1px solid rgba(255, 220, 100, 0.3);
    pointer-events: none;
    animation: bokehFloat var(--bd, 12s) var(--bdelay, 0s) ease-in-out infinite alternate;
  }
  @keyframes bokehFloat {
    0%   { transform: translate(0, 0) scale(1); opacity: 0.4; }
    50%  { opacity: 0.7; }
    100% { transform: translate(var(--bx, 20px), var(--by, -30px)) scale(1.1); opacity: 0.3; }
  }

  /* ── Central card ── */
  #hero {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding-left: 7vw;
    z-index: 20;
    pointer-events: none;
  }

  .hero-card {
    pointer-events: all;
    background: rgba(10, 20, 40, 0.55);
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 36px 44px 32px;
    text-align: left;
    max-width: 420px;
    width: auto;
    box-shadow:
      0 6px 24px rgba(5, 15, 40, 0.45),
      0 1px 6px rgba(5, 15, 40, 0.3),
      inset 0 1px 0 rgba(255,255,255,0.10);
    animation: cardAppear 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(32px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 240, 200, 0.7);
    margin-bottom: 18px;
  }

  .hero-title {
    font-family: 'Roboto', sans-serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 300;
    line-height: 1.22;
    color: #fff8f0;
    margin-bottom: 10px;
    text-shadow: 0 2px 20px rgba(10, 30, 60, 0.4);
    letter-spacing: -0.5px;
  }
  .hero-title .g-blue   { color: #4285F4; }
  .hero-title .g-red    { color: #EA4335; }
  .hero-title .g-yellow { color: #FBBC05; }
  .hero-title .g-green  { color: #34A853; }

  .hero-sub {
    font-family: 'Roboto', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    font-style: italic;
    color: rgba(255, 248, 230, 0.65);
    margin-bottom: 36px;
    line-height: 1.5;
    letter-spacing: 0.1px;
  }

  /* ── ENTER button — Material ripple ── */
  .enter-btn {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 44px;
    background: var(--google-blue);
    color: #fff;
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, box-shadow 0.25s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(66, 133, 244, 0.4), 0 1px 4px rgba(66,133,244,0.3);
    user-select: none;
  }
  .enter-btn:hover {
    background: var(--google-blue-dark);
    box-shadow: 0 6px 24px rgba(66, 133, 244, 0.55), 0 2px 8px rgba(66,133,244,0.35);
    transform: translateY(-1px);
  }
  .enter-btn:active { transform: translateY(0) scale(0.97); }

  /* Material ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: rippleAnim 0.55s linear;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* Arrow icon on button */
  .btn-arrow {
    display: inline-block;
    width: 18px; height: 18px;
    transition: transform 0.2s;
  }
  .enter-btn:hover .btn-arrow { transform: translateX(3px); }

  /* ── Google-style dot decoration ── */
  .google-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .gdot {
    width: 8px; height: 8px;
    border-radius: 50%;
    opacity: 0.7;
  }
  .gdot:nth-child(1) { background: #4285f4; }
  .gdot:nth-child(2) { background: #ea4335; }
  .gdot:nth-child(3) { background: #fbbc05; }
  .gdot:nth-child(4) { background: #34a853; }

  /* ── Tagline below card ── */
  .tagline {
    margin-top: 22px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: rgba(255,248,230,0.42);
    letter-spacing: 0.5px;
    animation: cardAppear 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
  }

  /* ── Loading veil ── */
  #veil {
    position: fixed; inset: 0; z-index: 100;
    background: #0d2240;
    animation: veilFade 1.2s ease-out 0.3s both;
  }
  @keyframes veilFade {
    to { opacity: 0; pointer-events: none; }
  }
</style>
</head>

      Enter
      <svg class="btn-arrow" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3.75 9H14.25M9.75 4.5L14.25 9L9.75 13.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</div>

<script>
  /* Stars */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `
      left: ${Math.random() * 100}vw;
      top:  ${Math.random() * 55}vh;
      --op: ${(0.4 + Math.random() * 0.6).toFixed(2)};
      --d: ${(2 + Math.random() * 4).toFixed(1)}s;
      --delay: ${(Math.random() * 4).toFixed(1)}s;
      width: ${Math.random() > 0.8 ? 3 : 2}px;
      height: ${Math.random() > 0.8 ? 3 : 2}px;
    `;
    starsEl.appendChild(s);
  }

  /* Bokeh orbs */
  const bokehEl = document.getElementById('bokeh');
  const bokehColors = [
    'rgba(255, 220, 100, 0.15)',
    'rgba(100, 180, 255, 0.12)',
    'rgba(255, 160, 100, 0.12)',
    'rgba(200, 230, 255, 0.1)',
  ];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'bokeh';
    const size = 20 + Math.random() * 80;
    const col = bokehColors[Math.floor(Math.random() * bokehColors.length)];
    b.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${Math.random() * 100}vw;
      top:  ${Math.random() * 100}vh;
      background: ${col};
      border-color: ${col.replace('0.1', '0.25').replace('0.12','0.25').replace('0.15','0.3')};
      --bd: ${(8 + Math.random() * 10).toFixed(1)}s;
      --bdelay: ${(Math.random() * 6).toFixed(1)}s;
      --bx: ${(-30 + Math.random() * 60).toFixed(0)}px;
      --by: ${(-50 + Math.random() * 60).toFixed(0)}px;
    `;
    bokehEl.appendChild(b);
  }

  /* Material ripple effect */
  document.getElementById('enterBtn').addEventListener('click', function(e) {
    const btn = this;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height) * 2;
    ripple.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${e.clientX - rect.left - size/2}px;
      top:  ${e.clientY - rect.top  - size/2}px;
    `;
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
</script>
</body>
</html>
